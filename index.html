<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">joonnoir ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-light: #f6f6f6;
      --bg-mist: #e5e5e5;
      --bg-sage-gray: #dce0dc;
      --surface-white: #fbfbfb;
      --card-bg: rgba(251, 251, 251, 0.96);
      --border-soft: #e2e2e2;
      --silver-mid: #b4b4b4;
      --charcoal-dark: #666666;
      --text-main: #4a4a4a;
      --text-muted: #7a7a7a;
      --shadow-soft: 0 10px 28px rgba(102, 102, 102, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, var(--surface-white) 0%, var(--bg-light) 48%, var(--bg-mist) 85%, var(--bg-sage-gray) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px 14px 70px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    /* การ์ดที่ 1: โปรไฟล์ & ไบโอ */
    .header-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 14px 16px 22px;
      box-shadow: var(--shadow-soft);
      border: 1.5px solid var(--surface-white);
      text-align: center;
      margin-bottom: 16px;
    }

    .banner-img {
      width: 100%;
      height: 142px;
      border-radius: 20px;
      object-fit: cover;
      background: var(--bg-mist);
      border: 1.5px solid var(--surface-white);
      display: block;
    }

    .profile-wrap {
      margin-top: -46px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .profile-img {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid var(--surface-white);
      box-shadow: 0 6px 18px rgba(102, 102, 102, 0.22);
      background: var(--surface-white);
      display: block;
    }

    .store-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--charcoal-dark);
      margin-top: 10px;
      letter-spacing: 0.4px;
    }

    .store-bio {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.75;
      white-space: pre-line;
      padding: 0 8px;
    }

    /* การ์ดแยกส่วน (ไฮไลท์ / รีวิว) */
    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 26px;
      padding: 18px 16px;
      box-shadow: var(--shadow-soft);
      border: 1.5px solid var(--surface-white);
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--charcoal-dark);
      margin-bottom: 14px;
      text-align: center;
    }

    .highlights-container {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 4px 2px 8px;
      scrollbar-width: none;
      justify-content: flex-start;
    }

    .highlights-container.centered {
      justify-content: center;
    }

    .highlights-container::-webkit-scrollbar {
      display: none;
    }

    .highlight-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      width: 72px;
      cursor: pointer;
    }

    .highlight-ring {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, var(--silver-mid), var(--charcoal-dark));
      box-shadow: 0 4px 12px rgba(102, 102, 102, 0.2);
      transition: transform 0.2s ease;
    }

    .highlight-item:active .highlight-ring {
      transform: scale(0.94);
    }

    .highlight-thumb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--surface-white);
      background: var(--surface-white);
      display: block;
    }

    .highlight-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-top: 6px;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* รายการรีวิว */
    .reviews-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .review-bubble {
      background: var(--surface-white);
      border-radius: 18px;
      padding: 12px 14px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 3px 10px rgba(102, 102, 102, 0.06);
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .review-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-word;
    }

    .review-stars {
      font-size: 12.5px;
      color: var(--charcoal-dark);
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .review-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 5px;
      line-height: 1.55;
      white-space: pre-line;
      word-break: break-word;
    }

    .review-time {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: right;
    }

    /* ฟอร์มส่งรีวิวในส่วนเดียวกัน */
    .review-form-box {
      border-top: 1.5px dashed var(--border-soft);
      padding-top: 14px;
    }

    .star-select-box {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .star-btn {
      background: none;
      border: none;
      font-size: 26px;
      color: #d0d0d0;
      cursor: pointer;
      transition: transform 0.15s, color 0.15s;
      user-select: none;
    }

    .star-btn.active {
      color: var(--charcoal-dark);
      transform: scale(1.1);
    }

    .form-group {
      margin-bottom: 10px;
    }

    .input-field, .textarea-field {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border-soft);
      border-radius: 16px;
      font-size: 13px;
      background: var(--bg-light);
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }

    .input-field:focus, .textarea-field:focus {
      border-color: var(--charcoal-dark);
      background: var(--surface-white);
    }

    .textarea-field {
      min-height: 78px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #7c7c7c, var(--charcoal-dark));
      color: var(--surface-white);
      border: none;
      padding: 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(102, 102, 102, 0.24);
      transition: all 0.2s;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .footer-note {
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 12px;
      font-weight: 500;
    }

    /* Story Viewer Modal */
    .story-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(58, 58, 58, 0.94);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
      padding: 14px;
    }

    .story-modal.open {
      display: flex;
    }

    .story-card {
      width: 100%;
      max-width: 420px;
      height: 88vh;
      max-height: 780px;
      position: relative;
      background: #3a3a3a;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }

    .story-bars {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }

    .story-bar {
      flex: 1;
      height: 3.5px;
      background: rgba(251, 251, 251, 0.32);
      border-radius: 4px;
      overflow: hidden;
    }

    .story-bar.done {
      background: var(--surface-white);
    }

    .story-bar.active {
      background: var(--silver-mid);
    }

    .story-header {
      position: absolute;
      top: 24px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      color: var(--surface-white);
    }

    .story-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .story-header-thumb {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid var(--surface-white);
      object-fit: cover;
    }

    .story-header-name {
      font-size: 14px;
      font-weight: 700;
    }

    .story-close-btn {
      background: rgba(251, 251, 251, 0.18);
      border: none;
      color: var(--surface-white);
      font-size: 16px;
      font-weight: 700;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-image-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 12px 36px;
    }

    .story-image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 14px;
    }

    .story-tap-left, .story-tap-right {
      position: absolute;
      top: 56px;
      bottom: 0;
      width: 45%;
      z-index: 5;
      cursor: pointer;
    }

    .story-tap-left {
      left: 0;
    }

    .story-tap-right {
      right: 0;
    }

    .story-footer-counter {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(251, 251, 251, 0.88);
      font-size: 12px;
      font-weight: 600;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- เพลงพื้นหลัง -->
  <audio id="bgMusic" loop preload="auto" src="https://file.garden/asG8Gt-rqWIpi3II/BTS%20(%E1%84%87%E1%85%A1%E1%86%BC%E1%84%90%E1%85%A1%E1%86%AB%E1%84%89%E1%85%A9%E1%84%82%E1%85%A7%E1%86%AB%E1%84%83%E1%85%A1%E1%86%AB)%20-%20Heartbeat%20(Color%20Coded%20Lyrics%20Eng%20Rom%20Han%20%E1%84%80%E1%85%A1%E1%84%89%E1%85%A1).mp3"></audio>

  <div class="container">

    <!-- 1. การ์ดโปรไฟล์ & ไบโอ -->
    <div class="header-card">
      <img id="mainBanner" src="https://files.catbox.moe/awzcy4.jpeg" alt="Banner" class="banner-img">
      <div class="profile-wrap">
        <img id="mainProfile" src="https://files.catbox.moe/3sjpq9.jpeg" alt="Profile" class="profile-img">
      </div>
      <h1 class="store-name" id="mainStoreName">joonnoir</h1>
      <p class="store-bio" id="mainStoreBio">joonjoon
a little shop for k-pop lovers
photocards • k-pop goods • premium apps
digital services & more ♡
made with love, packed with care</p>
    </div>

    <!-- 2. การ์ดไฮไลท์ (รองรับไม่จำกัดจำนวน) -->
    <div class="section-card">
      <div class="section-title" id="highlightsSectionTitle">the love archive</div>
      <div class="highlights-container" id="highlightsContainer">
        <p style="width:100%; text-align:center; color:var(--text-muted); font-size:12.5px;">ยังไม่มีรายการไฮไลท์ ♡</p>
      </div>
    </div>

    <!-- 3. การ์ดรีวิวลูกค้า + ฟอร์มส่งรีวิว -->
    <div class="section-card">
      <div class="section-title" id="reviewsSectionTitle">รีวิวจากลูกค้าบ้านจุนจุน</div>

      <div class="reviews-list" id="reviewsContainer">
        <p style="text-align:center; color:var(--text-muted); font-size:13px; padding:12px;">กำลังโหลดรีวิว ♡</p>
      </div>

      <div class="review-form-box">
        <div class="star-select-box" id="starSelector">
          <button type="button" class="star-btn active" data-val="1" onclick="setStars(1)">★</button>
          <button type="button" class="star-btn active" data-val="2" onclick="setStars(2)">★</button>
          <button type="button" class="star-btn active" data-val="3" onclick="setStars(3)">★</button>
          <button type="button" class="star-btn active" data-val="4" onclick="setStars(4)">★</button>
          <button type="button" class="star-btn active" data-val="5" onclick="setStars(5)">★</button>
        </div>

        <div class="form-group">
          <input type="text" class="input-field" id="customerName" placeholder="ชื่อของคุณ ♡" maxlength="40">
        </div>

        <div class="form-group">
          <textarea class="textarea-field" id="customerFeedback" rows="3" placeholder="เขียนรีวิวให้บ้านจุนจุนได้เลยนะคะ ♡" maxlength="400"></textarea>
        </div>

        <button type="button" class="submit-btn" id="submitBtn" onclick="sendReview()">ส่งรีวิว ♡</button>
      </div>
    </div>

    <div class="footer-note" id="footerThankYouText">♡ Thank you for supporting joonnoir ♡</div>

  </div>

  <!-- Story Viewer Modal -->
  <div class="story-modal" id="storyModal">
    <div class="story-card">
      <div class="story-bars" id="storyBars"></div>

      <div class="story-header">
        <div class="story-header-left">
          <img id="storyHeaderThumb" class="story-header-thumb" src="" alt="">
          <span id="storyHeaderName" class="story-header-name">Highlight</span>
        </div>
        <button type="button" class="story-close-btn" onclick="closeStory()">✕</button>
      </div>

      <div class="story-image-container">
        <img id="storyImage" class="story-image" src="" alt="">
        <div class="story-tap-left" onclick="prevStoryImage()"></div>
        <div class="story-tap-right" onclick="nextStoryImage()"></div>
      </div>

      <div class="story-footer-counter" id="storyCounterText">1 / 1</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const DB_SITE = "joonnoir_site";
    const DB_REVIEWS = "joonnoir_reviews";
    const DB_HIGHLIGHTS = "joonnoir_highlights";

    const DEFAULT_PROFILE_URL = "https://files.catbox.moe/3sjpq9.jpeg";
    const DEFAULT_BANNER_URL = "https://files.catbox.moe/3sjpq9.jpeg";
    const DEFAULT_BIO_TEXT = "joonnoir 𐙚\na little shop for k-pop lovers\nphotocards • k-pop goods • premium apps\ndigital services & more ♡\nmade with love, packed with care";
    const DEFAULT_MUSIC_URL = "https://file.garden/asG8Gt-rqWIpi3II/BTS%20(%E1%84%87%E1%85%A1%E1%86%BC%E1%84%90%E1%85%A1%E1%86%AB%E1%84%89%E1%85%A9%E1%84%82%E1%85%A7%E1%86%AB%E1%84%83%E1%85%A1%E1%86%AB)%20-%20Heartbeat%20(Color%20Coded%20Lyrics%20Eng%20Rom%20Han%20%E1%84%80%E1%85%A1%E1%84%89%E1%85%A1).mp3";

    let highlightsMap = {};
    let activeStoryId = null;
    let activeStoryIndex = 0;
    let currentRating = 5;

    let latestConfigData = {};
    let latestMediaData = {};

    const music = document.getElementById('bgMusic');

    ['touchstart', 'click'].forEach(evt => {
      document.addEventListener(evt, () => {
        if (music.paused) {
          music.play().catch(() => {});
        }
      }, { once: true });
    });

    function renderShopConfigAndMedia() {
      const d = latestConfigData || {};
      const m = latestMediaData || {};

      const shopName = d.shopName || "joonnoir";
      document.getElementById('mainStoreName').textContent = shopName;
      document.getElementById('pageTitle').textContent = shopName + " ♡";

      if (d.shopBio !== undefined && d.shopBio !== "") {
        document.getElementById('mainStoreBio').textContent = d.shopBio;
      }
      if (d.highlightsTitle) {
        document.getElementById('highlightsSectionTitle').textContent = d.highlightsTitle;
      }
      if (d.reviewsTitle) {
        document.getElementById('reviewsSectionTitle').textContent = d.reviewsTitle;
      }
      if (d.footerText) {
        document.getElementById('footerThankYouText').textContent = d.footerText;
      }

      const bannerEl = document.getElementById('mainBanner');
      const bannerSrc = m.bannerImg || d.bannerImg;
      bannerEl.onerror = () => { bannerEl.src = DEFAULT_BANNER_URL; };
      bannerEl.src = bannerSrc || DEFAULT_BANNER_URL;

      const profileEl = document.getElementById('mainProfile');
      const profileSrc = m.profileImg || d.profileImg;
      profileEl.onerror = () => { profileEl.src = DEFAULT_PROFILE_URL; };
      profileEl.src = profileSrc || DEFAULT_PROFILE_URL;

      const targetMusic = d.musicUrl || DEFAULT_MUSIC_URL;
      if (targetMusic && music.src !== targetMusic) {
        music.src = targetMusic;
      }
    }

    db.collection(DB_SITE).doc("config").onSnapshot(doc => {
      if (doc.exists) {
        latestConfigData = doc.data() || {};
        renderShopConfigAndMedia();
      }
    });

    db.collection(DB_SITE).doc("media").onSnapshot(doc => {
      if (doc.exists) {
        latestMediaData = doc.data() || {};
        renderShopConfigAndMedia();
      }
    });

    db.collection(DB_HIGHLIGHTS).orderBy("order", "asc").onSnapshot(async snap => {
      const container = document.getElementById('highlightsContainer');

      if (snap.empty) {
        container.classList.add('centered');
        container.innerHTML = '<p style="width:100%; text-align:center; color:var(--text-muted); font-size:12.5px;">ยังไม่มีรายการไฮไลท์ ♡</p>';
        highlightsMap = {};
        return;
      }

      container.classList.toggle('centered', snap.size <= 3);
      container.innerHTML = '';
      highlightsMap = {};

      for (const doc of snap.docs) {
        const hlData = doc.data();
        const hlId = doc.id;

        const imgSnap = await db.collection(DB_HIGHLIGHTS).doc(hlId).collection("images").orderBy("createdAt", "asc").get();
        const imgUrls = [];
        imgSnap.forEach(imgDoc => {
          const item = imgDoc.data();
          const src = item.dataUrl || item.url;
          if (src) imgUrls.push(src);
        });

        highlightsMap[hlId] = {
          id: hlId,
          title: hlData.title || "Highlight",
          cover: hlData.coverDataUrl || hlData.cover || imgUrls[0] || DEFAULT_PROFILE_URL,
          images: imgUrls
        };

        const itemDiv = document.createElement('div');
        itemDiv.className = 'highlight-item';
        itemDiv.onclick = () => openStory(hlId);
        itemDiv.innerHTML = `
          <div class="highlight-ring">
            <img src="${highlightsMap[hlId].cover}" class="highlight-thumb" alt="${escapeHtml(highlightsMap[hlId].title)}">
          </div>
          <div class="highlight-label">${escapeHtml(highlightsMap[hlId].title)}</div>
        `;
        container.appendChild(itemDiv);
      }
    });

    function openStory(hlId) {
      const hl = highlightsMap[hlId];
      if (!hl || hl.images.length === 0) {
        alert('ไฮไลท์นี้ยังไม่มีรูปภาพด้านในค่ะ ♡');
        return;
      }
      activeStoryId = hlId;
      activeStoryIndex = 0;

      document.getElementById('storyHeaderThumb').src = hl.cover;
      document.getElementById('storyHeaderName').textContent = hl.title;

      const barsBox = document.getElementById('storyBars');
      barsBox.innerHTML = '';
      hl.images.forEach((_, idx) => {
        const b = document.createElement('div');
        b.className = 'story-bar' + (idx === 0 ? ' active' : '');
        b.id = `storyBar_${idx}`;
        barsBox.appendChild(b);
      });

      document.getElementById('storyModal').classList.add('open');
      showStorySlide();
    }

    function showStorySlide() {
      const hl = highlightsMap[activeStoryId];
      if (!hl) return;
      const total = hl.images.length;

      if (activeStoryIndex >= total) {
        closeStory();
        return;
      }

      document.getElementById('storyImage').src = hl.images[activeStoryIndex];
      document.getElementById('storyCounterText').textContent = `${activeStoryIndex + 1} / ${total}`;

      for (let i = 0; i < total; i++) {
        const bar = document.getElementById(`storyBar_${i}`);
        if (!bar) continue;
        bar.className = 'story-bar' + (i < activeStoryIndex ? ' done' : (i === activeStoryIndex ? ' active' : ''));
      }
    }

    function nextStoryImage() {
      const hl = highlightsMap[activeStoryId];
      if (!hl) return;
      if (activeStoryIndex < hl.images.length - 1) {
        activeStoryIndex++;
        showStorySlide();
      } else {
        closeStory();
      }
    }

    function prevStoryImage() {
      if (activeStoryIndex > 0) {
        activeStoryIndex--;
        showStorySlide();
      }
    }

    function closeStory() {
      document.getElementById('storyModal').classList.remove('open');
      activeStoryId = null;
    }

    function setStars(star) {
      currentRating = star;
      document.querySelectorAll('#starSelector .star-btn').forEach(btn => {
        const val = parseInt(btn.getAttribute('data-val'), 10);
        btn.classList.toggle('active', val <= star);
      });
    }

    function formatShortThaiDate(dateObj) {
      if (!dateObj) return '';
      const shortMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
      return `${dateObj.getDate()} ${shortMonths[dateObj.getMonth()]}`;
    }

    async function sendReview() {
      const nameInput = document.getElementById('customerName');
      const feedbackInput = document.getElementById('customerFeedback');
      const submitBtn = document.getElementById('submitBtn');

      const name = nameInput.value.trim();
      const feedback = feedbackInput.value.trim();

      if (!name || !feedback) {
        alert('กรุณากรอกชื่อและข้อความรีวิวก่อนส่งนะคะ ♡');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'กำลังส่งรีวิว ♡';

      const now = new Date();
      const dateStr = formatShortThaiDate(now);

      try {
        await db.collection(DB_REVIEWS).add({
          name: name,
          stars: currentRating,
          feedback: feedback,
          dateStr: dateStr,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        nameInput.value = '';
        feedbackInput.value = '';
        setStars(5);
        alert('ขอบคุณสำหรับรีวิวนะคะ ♡');
      } catch (err) {
        alert('ส่งรีวิวไม่สำเร็จ: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'ส่งรีวิว ♡';
      }
    }

    db.collection(DB_REVIEWS).orderBy("createdAt", "desc").onSnapshot(snap => {
      const container = document.getElementById('reviewsContainer');
      if (snap.empty) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:13px; padding:12px;">ยังไม่มีรีวิว มารีวิวเป็นคนแรกได้เลยนะคะ ♡</p>';
        return;
      }

      let html = '';
      snap.forEach(doc => {
        const d = doc.data();
        const stars = Math.min(5, Math.max(1, parseInt(d.stars || d.rating || 5, 10)));
        const text = d.feedback || d.text || '';
        let dateLabel = d.dateStr || d.shortDate || '';
        if (!dateLabel && d.createdAt) {
          const ms = d.createdAt.toMillis ? d.createdAt.toMillis() : d.createdAt.seconds * 1000;
          dateLabel = formatShortThaiDate(new Date(ms));
        }

        html += `
          <div class="review-bubble">
            <div class="review-header">
              <span class="review-name">${escapeHtml(d.name || 'ลูกค้า')}</span>
              <span class="review-stars">${'★'.repeat(stars) + '☆'.repeat(5 - stars)}</span>
            </div>
            <div class="review-desc">${escapeHtml(text)}</div>
            ${dateLabel ? `<div class="review-time">${escapeHtml(dateLabel)}</div>` : ''}
          </div>
        `;
      });
      container.innerHTML = html;
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
